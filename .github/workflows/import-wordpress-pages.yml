name: Import Original Lawfinity Pages
on:
  push:
    branches: [main]
    paths:
      - "scripts/import_wordpress_pages.py"
      - ".github/workflows/import-wordpress-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pyyaml
      - name: Retrieve full WordPress page content
        run: python scripts/import_wordpress_pages.py
      - name: Commit original legal copy and policy texts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/ */index.md live-content-import-report.json
          git diff --cached --quiet || git commit -m "Import complete live Lawfinity service and policy content"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-content-import-report
          path: live-content-import-report.json
          if-no-files-found: warn
