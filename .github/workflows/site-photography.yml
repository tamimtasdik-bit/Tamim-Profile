name: Install editorial website photography
on:
  push:
    branches: [main]
    paths:
      - "scripts/download_site_photography.py"
      - ".github/workflows/site-photography.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow requests
      - name: Download and optimise licensed photographs
        run: python scripts/download_site_photography.py
      - name: Store photos in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/
          git diff --cached --quiet || git commit -m "Add licensed editorial imagery for Lawfinity"
          git push
