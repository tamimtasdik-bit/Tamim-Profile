name: Audit Lawfinity WordPress Pages
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_wordpress_pages.py"
      - ".github/workflows/audit-wordpress.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect original content sources
        run: python scripts/audit_wordpress_pages.py
      - name: Commit audit for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-audit-report.json
          git diff --cached --quiet || git commit -m "Record WordPress page content audit"
          git push
