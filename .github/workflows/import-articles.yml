name: Import original Lawfinity articles

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_lawfinity_articles.py"
      - ".github/workflows/import-articles.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public-source HTML parser
        run: python -m pip install requests beautifulsoup4
      - name: Fetch and validate complete original articles
        run: python scripts/import_lawfinity_articles.py
      - name: Commit migrated article bodies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts article-import-report.json
          git diff --cached --quiet || git commit -m "Import 28 complete original Lawfinity blog articles"
          git push
      - name: Upload site audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-import-audit
          path: article-import-report.json
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build migrated site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - name: Deploy migrated site
        id: deployment
        uses: actions/deploy-pages@v4
