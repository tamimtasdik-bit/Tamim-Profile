<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F8EFE5">
  <title>{% if page.title %}{{ page.title }} | {% endif %}Lawfinity Solicitors</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/reference-refinement.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/logo-palette.css' | relative_url }}?v=20261021-3">
  <link rel="stylesheet" href="{{ '/assets/css/premium-editorial.css' | relative_url }}?v=20261021-3">
  <link rel="stylesheet" href="{{ '/assets/css/desktop-polish.css' | relative_url }}?v=20261021-4">
</head>
<body class="{{ page.body_class | default: '' }}">
  {% include header.html %}
  <main id="main">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
