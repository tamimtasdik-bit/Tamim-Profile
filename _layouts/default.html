<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245F73">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class | default: '' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
