<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F5F5EF">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="robots" content="noindex,follow">
  <title>{% if page.title %}{{ page.title }} | {% endif %}Lawfinity Solicitors</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/replica-site.css' | relative_url }}?v=20261021-navy-rebuild">
</head>
<body class="{{ page.body_class | default: '' }}">
  {% include header.html %}
  <main id="main">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
