---
layout: default
---
<section class="page-hero">
  <div class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="{{ '/' | relative_url }}">Home</a><span>/</span><span>{{ page.title }}</span>
    </nav>
    <p class="eyebrow">{{ page.eyebrow | default: 'Lawfinity Solicitors' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </div>
</section>
<section class="page-section">
  <div class="container prose">
    {{ content }}
  </div>
</section>
